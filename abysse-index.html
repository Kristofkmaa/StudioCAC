<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Saitora, sites vitrines (version abysse)</title>
<meta name="theme-color" content="#012624">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="polices/inter-tight-500-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="abysse.css">
<style>
/* Écran d'entrée, version test « abysse » : la sphère de particules, le grand logo, le nom en géant dont les deux
   moitiés se rejoignent (« Sai » de la gauche, « tora » de la droite), puis la porte « Entrer ». Tient dans un écran. */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--silver);font:400 16px/1.4 "Inter Tight",ui-sans-serif,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--mist);outline-offset:3px}
.door{position:relative;height:100%;display:grid;grid-template-rows:1fr auto;padding:max(24px,env(safe-area-inset-top)) max(16px,clamp(16px,4vw,48px)) max(24px,env(safe-area-inset-bottom));isolation:isolate;overflow:clip}
#orb{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
.mark{width:clamp(96px,min(26vw,17svh),168px);height:auto;aspect-ratio:740/590;color:var(--white);animation:pose 1.1s cubic-bezier(.16,1,.3,1) both}
.mark circle{fill:#FAD1FF}
@keyframes pose{from{opacity:0;transform:translateY(-14px) scale(.92)}}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.mid{align-self:center;display:grid;justify-items:center;text-align:center;gap:clamp(18px,3vh,32px)}
h1{margin:0;color:var(--white);font-weight:500;font-size:clamp(4rem,min(26vw,30svh),18.4rem);line-height:.9;letter-spacing:-.05em;white-space:nowrap}
h1 span{display:inline-block;animation:de-gauche 1.4s cubic-bezier(.16,1,.3,1) both}
h1 span+span{animation-name:de-droite;color:transparent;-webkit-text-stroke:max(1.5px,.01em) var(--mist)}
@keyframes de-gauche{from{transform:translateX(-80vw);opacity:0}}
@keyframes de-droite{from{transform:translateX(80vw);opacity:0}}
.mid p{margin:0;max-width:34ch;font-size:clamp(1.1rem,1rem + .5vw,1.5rem);line-height:1.3;color:var(--mist);letter-spacing:-.01em}
.later{animation:monte 1s .8s cubic-bezier(.16,1,.3,1) both}
@keyframes monte{from{opacity:0;transform:translateY(16px)}}
.enter{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;min-width:220px;padding:20px 32px;border-radius:6px;background:var(--aurora);background-size:200% 100%;color:#1A1A1A;font:500 15px/1 "Inter Tight",sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:background-position .6s ease,transform .15s}
.enter::after{content:"→"}
@media (hover:hover) and (pointer:fine){.enter:hover{background-position:100% 0}}
.enter:active{transform:scale(.97)}
.foot{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
@media (prefers-reduced-motion:reduce){h1 span,.later,.mark{animation:none}}
@media (max-height:520px){.mid{gap:12px}.enter{min-height:52px}}
</style>
</head>
<body>
<script src="abysse-sphere.js"></script>
<script src="abysse-transition.js"></script>
<main class="door" data-arrive-off>
  <canvas id="orb" aria-hidden="true"></canvas>
  <div class="mid">
    <svg class="mark" viewBox="246 330 740 590" aria-hidden="true"><path d="M262 901L624 341L695 456L407 901Z M725 504L970 901L828 901L653 613Z" fill="currentColor"/><circle cx="620" cy="818" r="55"/></svg>
    <h1 aria-label="Saitora"><span>Sai</span><span>tora</span></h1>
    <p class="later">Votre vitrine, ouverte jour et nuit. Des sites sur mesure pour les restaurants, les artisans et les commerces.</p>
    <a class="enter later" href="abysse-accueil.html">Entrer</a>
  </div>
  <div class="foot later"><span>Sites vitrines sur mesure</span><span>Version de test « abysse »</span></div>
</main>

<script>
// la sphère du site (abysse-sphere.js) : tourne, penche vers le doigt, s'arrête si l'onglet est caché
(() => {
  const cv = document.getElementById("orb"), calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sphere = AbysseSphere.create(cv);
  let raf = 0, Z = 1;                                        // Z : zoom de la plongée vers le centre
  const loop = () => { sphere.draw({ Z }); raf = requestAnimationFrame(loop); };
  sphere.draw();
  addEventListener("resize", () => { sphere.size(); sphere.draw({ Z }); });
  if (calme) return;
  AbysseSphere.suivre(true);
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden) loop(); });
  loop();
  // « Entrer » : on plonge au centre de la sphère (le zoom accélère, les points passent de chaque côté de l'écran),
  // le texte s'efface en grandissant ; l'accueil reprend ensuite en reculant (dézoom) depuis l'intérieur de la même sphère
  const enter = document.querySelector(".enter"), mid = document.querySelector(".mid"), foot = document.querySelector(".foot");
  enter.addEventListener("click", e => {
    if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();                                       // la mini-plongée ne se déclenche pas : ici, c'est la grande
    AbysseSphere.suivre(false);                               // la sphère se recentre doucement
    try { sessionStorage.setItem("abysse-arrivee", "sphere"); } catch (_) {}
    let parti = false;
    const part = () => { if (!parti) { parti = true; location.href = enter.href; } };
    mid.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(1.5)" }], { duration: 520, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    foot.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, Math.max(0, (now - t0) / 1000));   // l'heure de l'image peut précéder le clic
      Z = 1 + Math.pow(p, 2.6) * 11; if (p < 1) requestAnimationFrame(step); else part(); };
    requestAnimationFrame(step);
    setTimeout(part, 1400);                                   // si le navigateur met l'animation en pause
  });
})();
</script>
</body>
</html>
