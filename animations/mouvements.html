<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouvements — toutes les animations, par métier</title>
<!--
  MOUVEMENTS — BIBLIOTHÈQUE COMPLÈTE (100 animations : 50 basiques, 50 premium), UN SEUL FICHIER, AUCUNE DÉPENDANCE

  STRUCTURE (note pour Claude Code ou tout autre assistant)
  - Chaque <template data-pack="..."> ci-dessous contient UNE PAGE COMPLÈTE ET AUTONOME :
    ses <style>, son HTML, son <script> (une IIFE). Rien n'est partagé entre les packs.
  - Pour réutiliser un pack ou une animation : copier le contenu du template dans une page vide
    (<!DOCTYPE html><html><head><meta viewport>…</head><body> contenu </body></html>).
  - Dans un pack, chaque animation = une <section id>, un bloc CSS sous /* NN nom */,
    un bloc JS sous // NN nom. L'index en tête de chaque pack donne numéro, id et description.
  - L'index de toutes les animations (numéro, pack, section, styles, déclencheurs, emplacement) est aussi
    disponible en JSON dans <script type="application/json" id="mvm-index">, tout en bas.
  - Le script tout en bas (le "lanceur") affiche l'index filtrable, un pack à la fois, et le menu "Métiers".
    Il n'est utile que pour cette page de démonstration ; ne pas le reprendre dans un vrai site.
  - Pour AJOUTER UN MÉTIER : ajouter un <template data-pack data-name data-group data-range>
    sur le même modèle ; le menu le liste automatiquement.

  INDEX
  PACK bases       Les bases    Tous métiers  animations 01 à 44
      01       #hero           Entrée de titre ligne par ligne, halos mouvants  [CSS]
      02       #reveal         Apparition au défilement  [IntersectionObserver]
      03       #mq             Bandeau défilant  [CSS + vitesse du scroll]
      04       #count          Chiffres qui comptent  [requestAnimationFrame]
      05       #tilt           Cartes en relief  [pointeur + perspective]
      06       #btn            Boutons  [micro-interactions]
      07       #hz             Défilement horizontal épinglé  [position: sticky]
      08       #scrub          Texte lié au défilement  [progression]
      09       #draw           Tracé qui se dessine  [SVG stroke-dashoffset]
      10       #spot           Projecteur  [masque CSS + pointeur]
      11       #(barre #bar)   Barre de progression de lecture  [scaleX lié au scroll]
      12 · 13  #hero2          Écran de chargement, puis titre machine à écrire
      14       #scr            Texte qui se décode  [requestAnimationFrame]
      15       #roll           Liens à lettres roulantes  [CSS, délai par lettre]
      16       #menu           Menu plein écran  [clip-path circle]
      17       #tabs           Onglets à pastille glissante  [transform + width]
      18       #acc            Accordéon fluide  [grid-template-rows 0fr → 1fr]
      19       #figs           Images dévoilées au rideau  [clip-path inset + zoom arrière]
      20       #ba             Avant / après  [glisser, clavier ← →]
      21       #car            Carrousel aimanté  [scroll-snap + échelle]
      22       #stk            Cartes qui s’empilent  [position: sticky + échelle]
      23       #zoom           Zoom épinglé  [scale lié au scroll]
      24       #odo            Prix à chiffres roulants  [translateY par colonne]
      25       #glow           Bordure lumineuse et squelette de chargement
      26       #form           Formulaire  [étiquettes flottantes, bouton qui se transforme]
      27       #theme          Bascule clair / sombre  [révélation circulaire]
      28       #hero3          Fond de particules reliées  [canvas 2D]
      29       #mk             Surlignage tracé et texte en dégradé animé  [SVG + background-clip]
      30       #lt             Lettres qui sortent du flou  [filter: blur, délai par lettre]
      31       #wave           Vagues de séparation  [SVG en boucle]
      32       #blob           Forme organique qui respire  [border-radius animé]
      33       #tl             Frise qui se remplit  [progression de scroll]
      34       #micro          J’aime et ajout au panier  [micro-interactions]
      35       #toast          Notifications empilées  [entrée, minuteur, sortie]
      36       #sheet          Feuille qui monte du bas  [ressort, glisser pour fermer]
      37       #flip           Cartes qui se retournent  [rotateY + backface-visibility]
      38       #exp            Galerie en accordéon  [flex animé]
      39       #cd             Compte à rebours à volets  [rotateX]
      40       #par            Décor en profondeur  [calques + pointeur]
      41       #badge          Pastille tournante  [texte sur cercle, lié au scroll]
      42       #map            Itinéraire qui se trace  [SVG, épingle à rebond]
      43       #pt             Transition entre pages  [volet + contenu qui remonte]
      44       #flt            Filtre animé  [technique FLIP]

  PACK bases2      Les bases 2  Tous métiers  animations 87 à 92
      87  #top     Bouton retour en haut avec anneau de progression (apparaît après un peu de défilement)
      88  #top     En-tête qui se cache en descendant et revient dès qu'on remonte
      89  #tips    Info-bulles animées, et bouton "copier" qui confirme
      90  #stars   Étoiles de notation : aperçu au survol, rebond à la sélection
      91  #ctrl    Interrupteur, case à cocher et boutons radio animés
      92  #modal   Fenêtre modale : fond flouté, entrée à ressort, fermeture animée

  PACK premium     Premium      Tous métiers  animations 54 à 64
      54  #hero    Ouverture "portes" : un mot plein écran se fend en deux et dévoile la page
      55  #hero    Fond aurore en WebGL (shader), déformé par le pointeur ; repli en dégradé CSS
      56  #isle    Barre de navigation "île" : large en haut, pastille en défilant, panneau au clic
      57  #kine    Typographie cinétique liée au défilement (sens alternés, inclinaison selon la vitesse)
      58  #cyl     Carrousel cylindrique 3D à inertie, aimanté
      59  #glow    Cartes dont la bordure s'allume près du pointeur
      60  #story   Récit au défilement : visuel collant qui se métamorphose d'étape en étape
      61  #deck    Pile de cartes à lancer (avis clients)
      62  #cursor  Curseur personnalisé qui se transforme, liens magnétiques
      63  #act     Glisser pour confirmer, et bouton à remplissage liquide
      64  footer   Pied de page dévoilé par en dessous, mot géant qui monte

  PACK premium3    Premium 2    Tous métiers  animations 77 à 86
      77  #lam      Ouverture en lamelles : le visuel arrive par bandes verticales, puis le titre
      78  #trail    Traînée d'images : des vignettes naissent sous le pointeur et retombent
      79  #path     Texte sur une courbe qui glisse avec le défilement
      80  #vague    Transition en vague : la section suivante monte avec un bord bombé qui s'aplatit
      81  #mosa     Mosaïque qui s'assemble : des tuiles éparpillées se rangent en grille
      82  #dates    Sélecteur de dates : la plage se remplit de proche en proche, le nombre de nuits suit
      83  #stories  Stories : barres de progression, avance automatique, toucher pour passer
      84  #dock     Dock magnétique : les icônes grossissent à l'approche du pointeur
      85  #tunnel   Tunnel de cartes en 3D : elles viennent vers soi en défilant
      86  #zoomt    Zoom à travers le titre : on traverse une lettre pour entrer dans la section suivante

  PACK premium4    Premium 3    Tous métiers  animations 93 à 100
      93  #react    Lettres réactives : le titre se soulève et s'allume sous le pointeur, une onde le parcourt au repos
      94  #iris     Révélation circulaire au défilement : la section suivante s'ouvre comme un iris
      95  #fan      Cartes en éventail : la pile se déploie en arc, la carte visée se lève
      96  #tarifs   Tarifs à surbrillance glissante : un fond coulisse derrière l'offre choisie
      97  #courbe   Courbe qui se trace, points qui apparaissent, lecture au pointeur
      98  #grains   Texte en particules : les grains s'assemblent en mot et fuient le pointeur
      99  #livret   Livret à pages tournées en 3D
      100 #mur      Mur incliné : rangées de visuels en perspective qui défilent en sens opposés

  PACK horlogerie  Horlogerie   Par métier    animations 45 à 53
      45  #hero    Séquence d'ouverture orchestrée (index, aiguilles, boîtier, titre)
      46  #hero    Montre à l'heure réelle : trotteuse à 8 battements/s, reflet du verre et inclinaison au pointeur
      47  #credo   Titre dévoilé ligne par ligne avec passage de lumière
      48  #eclate  Vue éclatée en 3D liée au défilement, légendes synchronisées
      49  #calibre Train de rouages qui engrènent (rapports réels), balancier, accéléré par le défilement
      50  #cadrans Galerie à inertie : glisser, élan, déformation selon la vitesse, aimantation
      51  #liste   Liste avec aperçu flottant qui suit le pointeur (au doigt : aperçu ancré à la ligne)
      52  #nuit    Passage jour / nuit lié au défilement, matière luminescente qui s'allume
      53  #essai   Bouton "maintenir pour confirmer" avec anneau de progression

  PACK restaurant  Restaurant   Par métier    animations 65 à 68
      65  #braise   Braises vivantes en canvas : maintenir appuyé pour souffler dessus
      66  #dress    Dressage d'une assiette piloté par le défilement (jus, pièce, légumes, herbes, huile)
      67  #ardoise  Ardoise du jour écrite à la craie, ligne après ligne
      68  #table    Plan de table : les chaises se placent autour de la table selon le nombre de couverts

  PACK architecte  Architecte   Par métier    animations 69 à 72
      69  #cotes   Outil de mesure : un réticule suit le pointeur et affiche les cotes en direct sur la façade
      70  #plan    Plan qui se trace au défilement : murs, portes qui s'ouvrent, mobilier, cotes qui comptent
      71  #iso     Maquette isométrique qui s'assemble niveau par niveau, puis s'éclaire
      72  #loupe   Du croquis au rendu : une loupe révèle la version habillée sous le dessin au trait

  PACK fleuriste   Fleuriste    Par métier    animations 73 à 76
      73  #pousse   Bouquet qui pousse : les tiges montent, les feuilles se déplient, les fleurs s'ouvrent
      74  #compose  Composer son bouquet : chaque fleur choisie pousse dans le vase, le prix suit
      75  #vent     Pétales au vent en canvas : le pointeur et le défilement font le vent
      76  #saisons  Roue des saisons à tourner, la liste des fleurs et la couleur suivent
-->
<style>html, body { margin: 0; background: #111; }</style>
</head>
<body>

<!-- ======================================================================
     PACK "bases" : Les bases (Tous métiers, animations 01 à 44)
     ====================================================================== -->
<template data-pack="bases" data-name="Les bases" data-group="Tous métiers" data-range="01 à 44">
<!--
  MOUVEMENTS — bibliothèque de 44 animations pour sites web
  Fichier unique, autonome : aucune bibliothèque, aucun asset externe.

  COMMENT S'EN SERVIR (note pour Claude Code ou tout autre assistant)
  - Chaque animation est une <section id="..."> dont l'étiquette .tag affiche son numéro.
  - Son CSS est sous un commentaire  /* NN nom */  dans <style>.
  - Son JavaScript est sous un commentaire  // NN nom  dans le <script> du même groupe.
  - Trois groupes, chacun avec son <style> et son <script> (IIFE indépendante) :
      GROUPE A = 01 à 11,  GROUPE B = 12 à 27,  GROUPE C = 28 à 44.
  - Variables communes dans :root (couleurs, polices, --e = courbe d'accélération).
  - Aides communes par groupe : $ / $$ (sélecteurs), clamp, IntersectionObserver (.rv ou .io -> ajoute .on),
    une boucle requestAnimationFrame par groupe pour les effets liés au défilement.
  - Tout respecte prefers-reduced-motion.
  Pour extraire une animation : prendre sa section HTML, son bloc CSS, son bloc JS,
  plus les variables :root et, si elle dépend du défilement, la partie correspondante de la boucle frame().

  INDEX (numéro, id de section, nom, technique)
  01       #hero           Entrée de titre ligne par ligne, halos mouvants  [CSS]
  02       #reveal         Apparition au défilement  [IntersectionObserver]
  03       #mq             Bandeau défilant  [CSS + vitesse du scroll]
  04       #count          Chiffres qui comptent  [requestAnimationFrame]
  05       #tilt           Cartes en relief  [pointeur + perspective]
  06       #btn            Boutons  [micro-interactions]
  07       #hz             Défilement horizontal épinglé  [position: sticky]
  08       #scrub          Texte lié au défilement  [progression]
  09       #draw           Tracé qui se dessine  [SVG stroke-dashoffset]
  10       #spot           Projecteur  [masque CSS + pointeur]
  11       #(barre #bar)   Barre de progression de lecture  [scaleX lié au scroll]
  12 · 13  #hero2          Écran de chargement, puis titre machine à écrire
  14       #scr            Texte qui se décode  [requestAnimationFrame]
  15       #roll           Liens à lettres roulantes  [CSS, délai par lettre]
  16       #menu           Menu plein écran  [clip-path circle]
  17       #tabs           Onglets à pastille glissante  [transform + width]
  18       #acc            Accordéon fluide  [grid-template-rows 0fr → 1fr]
  19       #figs           Images dévoilées au rideau  [clip-path inset + zoom arrière]
  20       #ba             Avant / après  [glisser, clavier ← →]
  21       #car            Carrousel aimanté  [scroll-snap + échelle]
  22       #stk            Cartes qui s’empilent  [position: sticky + échelle]
  23       #zoom           Zoom épinglé  [scale lié au scroll]
  24       #odo            Prix à chiffres roulants  [translateY par colonne]
  25       #glow           Bordure lumineuse et squelette de chargement
  26       #form           Formulaire  [étiquettes flottantes, bouton qui se transforme]
  27       #theme          Bascule clair / sombre  [révélation circulaire]
  28       #hero3          Fond de particules reliées  [canvas 2D]
  29       #mk             Surlignage tracé et texte en dégradé animé  [SVG + background-clip]
  30       #lt             Lettres qui sortent du flou  [filter: blur, délai par lettre]
  31       #wave           Vagues de séparation  [SVG en boucle]
  32       #blob           Forme organique qui respire  [border-radius animé]
  33       #tl             Frise qui se remplit  [progression de scroll]
  34       #micro          J’aime et ajout au panier  [micro-interactions]
  35       #toast          Notifications empilées  [entrée, minuteur, sortie]
  36       #sheet          Feuille qui monte du bas  [ressort, glisser pour fermer]
  37       #flip           Cartes qui se retournent  [rotateY + backface-visibility]
  38       #exp            Galerie en accordéon  [flex animé]
  39       #cd             Compte à rebours à volets  [rotateX]
  40       #par            Décor en profondeur  [calques + pointeur]
  41       #badge          Pastille tournante  [texte sur cercle, lié au scroll]
  42       #map            Itinéraire qui se trace  [SVG, épingle à rebond]
  43       #pt             Transition entre pages  [volet + contenu qui remonte]
  44       #flt            Filtre animé  [technique FLIP]
-->
<style>
/* ================= GROUPE A : 01 à 11 ================= */

  :root { --bg: #0d0c0b; --ink: #f3ede2; --mute: #8e877b; --line: #2a2723; --acc: #ff5a2b; --acc2: #ffd9a0; --card: #171512; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  #bar { position: fixed; left: 0; top: 0; height: 3px; width: 100%; background: var(--acc); transform-origin: 0 50%; transform: scaleX(0); z-index: 50; }
  section { position: relative; padding: 110px 6vw; border-top: 1px solid var(--line); }
  .tag { display: flex; align-items: baseline; gap: 14px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 34px; flex-wrap: wrap; }
  .tag b { color: var(--acc); font-weight: 600; font-variant-numeric: tabular-nums; } .tag i { font-style: normal; text-transform: none; letter-spacing: 0; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 5.2vw, 60px); line-height: 1.08; letter-spacing: -.01em; max-width: 16ch; margin-bottom: 40px; }
  button { font: inherit; color: inherit; cursor: pointer; } button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 3px; }
  .replay { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 13px; color: var(--mute); margin-top: 28px; } .replay:hover { color: var(--ink); border-color: var(--mute); }

  /* 01 hero */
  #hero { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; border-top: 0; overflow: hidden; padding-bottom: 70px; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .b1 { width: 46vmax; height: 46vmax; background: #ff5a2b; left: -12vmax; top: -14vmax; animation: drift1 16s ease-in-out infinite alternate; }
  .b2 { width: 38vmax; height: 38vmax; background: #6b3bff; right: -10vmax; top: 6vmax; animation: drift2 19s ease-in-out infinite alternate; opacity: .4; }
  .b3 { width: 30vmax; height: 30vmax; background: #ffb347; left: 30vw; bottom: -18vmax; animation: drift3 14s ease-in-out infinite alternate; opacity: .35; }
  @keyframes drift1 { to { transform: translate(14vw, 12vh) scale(1.15); } } @keyframes drift2 { to { transform: translate(-16vw, 16vh) scale(.85); } } @keyframes drift3 { to { transform: translate(-10vw, -14vh) scale(1.25); } }
  #hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, rgba(13,12,11,0) 0, var(--bg) 78%); pointer-events: none; }
  #hero > :not(.blob) { position: relative; z-index: 2; } #hero .blob { z-index: 0; }
  #hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(46px, 11vw, 150px); line-height: .96; letter-spacing: -.025em; }
  .ln { display: block; overflow: hidden; padding-bottom: .08em; } .ln span { display: block; transform: translateY(112%) rotate(4deg); transform-origin: 0 100%; transition: transform 1.1s cubic-bezier(.16, 1, .3, 1); transition-delay: calc(var(--i) * 110ms); }
  .go .ln span { transform: none; } #hero h1 em { font-style: italic; color: var(--acc); }
  #hero .lead { max-width: 46ch; margin-top: 30px; color: #cfc8bb; font-size: clamp(16px, 1.5vw, 19px); opacity: 0; transform: translateY(16px); transition: opacity .9s .55s, transform .9s .55s cubic-bezier(.16, 1, .3, 1); } #hero.go .lead { opacity: 1; transform: none; }
  .cue { margin-top: 44px; display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); } .cue::before { content: ""; width: 1px; height: 44px; background: linear-gradient(var(--ink), transparent); animation: cue 1.8s ease-in-out infinite; transform-origin: 50% 0; } @keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  /* 02 reveal */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; }
  .card h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; } .card p { color: var(--mute); font-size: 15px; } .card .n { font-size: 13px; color: var(--acc); letter-spacing: .1em; }
  .rv { opacity: 0; transform: translateY(46px) scale(.97); transition: opacity .8s cubic-bezier(.16, 1, .3, 1), transform .9s cubic-bezier(.16, 1, .3, 1); transition-delay: calc(var(--i, 0) * 90ms); } .rv.on { opacity: 1; transform: none; }

  /* 03 marquee */
  #mq { padding-left: 0; padding-right: 0; overflow: hidden; } #mq .tag, #mq h2 { margin-left: 6vw; }
  .mrow { display: flex; white-space: nowrap; transform: skewX(var(--sk, 0deg)); will-change: transform; } .mrow + .mrow { margin-top: 6px; }
  .mtrack { display: flex; flex: none; animation: mq 26s linear infinite; } .mrow.rev .mtrack { animation-direction: reverse; animation-duration: 34s; }
  .mtrack span { font-family: var(--serif); font-size: clamp(40px, 9vw, 120px); line-height: 1.1; padding-right: .5em; } .mtrack span:nth-child(even) { color: transparent; -webkit-text-stroke: 1px var(--mute); } .mtrack span::after { content: "✦"; color: var(--acc); font-size: .4em; vertical-align: middle; margin-left: .55em; -webkit-text-stroke: 0; }
  @keyframes mq { to { transform: translateX(-50%); } }

  /* 04 counters */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 30px; align-items: end; }
  .stat .v { font-family: var(--serif); font-size: clamp(54px, 9vw, 110px); line-height: 1; font-variant-numeric: tabular-nums; } .stat .v small { font-size: .4em; color: var(--acc); margin-left: .1em; } .stat p { color: var(--mute); margin-top: 8px; font-size: 15px; }
  .ring { width: 150px; height: 150px; } .ring circle { fill: none; stroke-width: 6; } .ring .bgc { stroke: var(--line); } .ring .fg { stroke: var(--acc); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 2s cubic-bezier(.16, 1, .3, 1); } .ring.on .fg { stroke-dashoffset: .13; } .ring text { fill: var(--ink); font-family: var(--serif); font-size: 30px; }

  /* 05 tilt */
  .tilts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; perspective: 1100px; }
  .tilt { position: relative; aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1)); transition: transform .5s cubic-bezier(.16, 1, .3, 1); transform-style: preserve-3d; touch-action: pan-y; border: 1px solid rgba(255,255,255,.08); }
  .tilt.live { transition: transform .08s linear; } .tilt .art { position: absolute; inset: -8%; background: var(--g); transform: translate(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -14px)); transition: inherit; }
  .tilt .glare { position: absolute; inset: 0; background: radial-gradient(circle at calc(50% + var(--px, 0) * 50%) calc(50% + var(--py, 0) * 50%), rgba(255,255,255,.34), transparent 55%); opacity: var(--gl, 0); transition: opacity .4s; mix-blend-mode: soft-light; }
  .tilt .txt { position: absolute; left: 22px; bottom: 20px; right: 22px; transform: translateZ(40px); } .tilt .txt b { display: block; font-family: var(--serif); font-weight: 400; font-size: 28px; } .tilt .txt span { font-size: 13px; opacity: .8; letter-spacing: .08em; text-transform: uppercase; }
  @media (hover: none) { .tilt:not(.live) { animation: sway 6s ease-in-out infinite alternate; } .tilt:nth-child(2):not(.live) { animation-delay: -2s; } .tilt:nth-child(3):not(.live) { animation-delay: -4s; } } @keyframes sway { from { transform: rotateX(4deg) rotateY(-7deg); } to { transform: rotateX(-4deg) rotateY(7deg); } }

      + '<p class="rc" id="mvx-c" aria-live="polite"></p><div class="grid" id="mvx-g"></div><div id="mvx-s"></div><div id="mvx-m" role="status"></div>';
    D.body.appendChild(root); D.body.appendChild(box);
    var grid = D.getElementById('mvx-g'), cnt = D.getElementById('mvx-c'), bar = D.getElementById('mvx-s'), msg = D.getElementById('mvx-m');
    function say(t) { msg.textContent = t; msg.className = 'show'; st(function () { msg.className = ''; }, 2200); }
    function draw() { var list = DATA.filter(match); cnt.innerHTML = '<b>' + list.length + '</b> résultat' + (list.length > 1 ? 's' : '') + (F.q || F.s || F.g || F.e || F.p ? ' <button type="button" id="mvx-r">Tout réafficher</button>' : '');
      grid.innerHTML = list.length ? list.map(function (a) { var on = sel.indexOf(a.n) >= 0; return '<article class="' + (on ? 'sel' : '') + '"><div class="h"><b>' + num(a.n) + '</b><span>' + esc(pname[a.p]) + '</span></div><h2>' + esc(a.title) + '</h2><p>' + esc(a.d) + '</p><div class="tg">' + a.s.concat(a.g).map(function (t) { return '<i>' + esc(t) + '</i>'; }).join('') + '</div><div class="ac"><button type="button" class="see" data-n="' + a.n + '">Voir</button><button type="button" class="pick" data-n="' + a.n + '" aria-pressed="' + on + '">' + (on ? 'Retenue' : 'Retenir') + '</button><button type="button" class="cp" data-n="' + a.n + '" aria-label="Copier la référence de l’animation ' + a.n + '">Copier</button></div></article>'; }).join('') : '<p class="none">Aucune animation ne correspond. Essaie un autre mot ou enlève un filtre.</p>';
      bar.className = sel.length ? 'show' : ''; bar.innerHTML = sel.length ? '<span><b>' + sel.length + '</b> retenue' + (sel.length > 1 ? 's' : '') + ' : ' + sel.slice().sort(function (x, y) { return x - y; }).map(num).join(', ') + '</span><button type="button" id="mvx-cp">Copier pour Claude Code</button><button type="button" id="mvx-cl">Vider</button>' : ''; }
    var byN = function (n) { return DATA.filter(function (a) { return a.n === +n; })[0]; };
    root.addEventListener('input', function (e) { if (e.target.id === 'mvx-q') { F.q = e.target.value; draw(); } });
    root.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var ch = b.closest('.chips');
      if (ch) { F[ch.dataset.f] = b.dataset.v; [].forEach.call(ch.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); }); return draw(); }
      if (b.id === 'mvx-r') { F = { q: '', s: '', g: '', e: '', p: '' }; return index(); }
      if (b.classList.contains('see')) { var a = byN(b.dataset.n); return go(a.p, a.t, a); }
      if (b.classList.contains('pick')) { var n = +b.dataset.n, i = sel.indexOf(n); if (i >= 0) sel.splice(i, 1); else sel.push(n); return draw(); }
      if (b.classList.contains('cp')) return copy(refText([byN(b.dataset.n)]), function (ok) { say(ok ? 'Référence copiée.' : 'Copie impossible ici : ouvre le fichier dans un navigateur.'); });
      if (b.id === 'mvx-cp') return copy(refText(sel.slice().sort(function (x, y) { return x - y; }).map(byN)), function (ok) { say(ok ? 'Liste copiée, prête à coller dans Claude Code.' : 'Copie impossible ici : ouvre le fichier dans un navigateur.'); });
      if (b.id === 'mvx-cl') { sel = []; return draw(); } });
    draw(); W.scrollTo(0, idxY);
  }
  W.__mvm = { go: go, index: index, data: DATA, packs: packs.map(function (p) { return { id: p.id, name: p.name, group: p.group, range: p.range }; }), state: function () { return { view: view, F: F, sel: sel }; } };
  var m = /pack=([\w-]+)/.exec(location.hash || ''), start = function () { if (m) go(m[1]); else index(); };
  if (D.readyState === 'loading') addD.call(D, 'DOMContentLoaded', start); else start();
})();
