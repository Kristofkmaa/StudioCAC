<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>(()=>{const d=document.documentElement;let t;try{t=localStorage.getItem("saitora-theme")}catch(e){}d.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)d.classList.add("sc-pending")})()</script>
<style>html,body{background:#012624}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toutes les démos, Saitora</title>
<meta name="description" content="Les treize sites de démonstration de Saitora, un par métier : restaurant, artisans, boutiques, services, séjours. Chacun a son style et son idée.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="polices/jost-a2e892.css">
<link rel="stylesheet" href="commun/abysse.css?v=3">
<style>
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--font:"Jost","Futura","Helvetica Neue",Arial,sans-serif;--page:min(1180px,100% - 2 * clamp(20px,4vw,40px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65}
h1,h2,p,ul{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.page{width:var(--page);margin-inline:auto}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--accent);margin-left:.04em}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .page{display:flex;align-items:center;justify-content:space-between;gap:24px;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand .mark{height:26px;width:auto;display:block}
.brand img{display:block;height:18px;width:auto;filter:var(--logo-filter)}
.bar .right{display:flex;align-items:center;gap:20px}
@media (max-width:400px){.bar .page{gap:12px}.bar .right{gap:12px}}
.back{font-size:15px;color:var(--muted);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;font:500 16px var(--font);padding:13px 22px;border-radius:4px;border:1px solid var(--line-hi);background:none;color:var(--ink);text-decoration:none}
.btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.doc{padding-block:clamp(48px,7vw,88px) clamp(64px,8vw,112px);max-width:760px}
.doc h1{font-weight:400;font-size:clamp(2.2rem,1.5rem + 3vw,3.6rem);line-height:1.04;letter-spacing:-.03em}
.doc .lead{margin-top:16px;color:var(--muted);font-size:1.1rem}
.doc h2{font-weight:500;font-size:1.3rem;margin-top:44px;padding-top:24px;border-top:1px solid var(--line-hi)}
.doc h3{font-weight:500;font-size:1.05rem;margin:22px 0 4px}
.doc p,.doc ul{margin-top:10px}
.doc ul{padding-left:20px}
.doc li+li{margin-top:6px}
.doc a{text-underline-offset:4px;text-decoration-color:var(--accent)}
.doc .muted{color:var(--muted)}
@media (pointer:coarse){.doc p a,.doc li a{display:inline-block;padding-block:8px;margin-block:-8px}}
@media (hover:hover) and (pointer:fine){.back:hover{color:var(--ink)}.btn:hover{border-color:var(--ink)}.btn.primary:hover{background:var(--accent-hover)}}
@media (pointer:coarse){.brand{padding-block:9px;margin-block:-9px}.theme-toggle{width:44px;height:44px}.back{padding-block:12px}}
</style>
<style>
.liste{padding-block:clamp(48px,7vw,88px) clamp(64px,8vw,112px)}
.liste h1{font-weight:400;font-size:clamp(2.2rem,1.5rem + 3vw,3.6rem);line-height:1.04;letter-spacing:-.03em}
.liste .lead{margin-top:16px;color:var(--muted);font-size:1.1rem;max-width:56ch}
.filtres{margin-top:32px;display:flex;flex-wrap:wrap;gap:8px}
.filtres button{min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-hi);background:none;color:var(--ink);font:500 15px var(--font);cursor:pointer;transition:background-color .2s,color .2s}
.filtres button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
@media (hover:hover) and (pointer:fine){.filtres button:not([aria-pressed="true"]):hover{border-color:var(--ink)}}
.works{margin-top:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.work{display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:16px;background:var(--kelp);text-decoration:none;color:var(--ink);transition:background-color .3s}
.work[hidden]{display:none}
.work .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.work h2{font-weight:400;font-size:clamp(1.4rem,1.2rem + .6vw,1.8rem);letter-spacing:-.02em;line-height:1.1}
.work .metier{margin-top:6px;display:block;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--silver)}
.work p{font-size:15px;line-height:1.5}
.work .shot{margin-top:auto;border-radius:6px;overflow:hidden;background:var(--deep)}
.work .shot img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.work .une{font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.work:hover{background:var(--kelp-hi)}.work:hover .shot img{transform:scale(1.04)}}
@media (max-width:980px){.works{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.works{grid-template-columns:minmax(0,1fr)}.work{padding:22px}}
</style>
<link rel="stylesheet" href="commun/abysse-fin.css?v=3">
</head>
<body>
<script src="commun/demos.js?v=1"></script>
<script src="commun/abysse-sphere.js?v=3"></script>
<script src="commun/abysse-transition.js?v=4"></script>
<script src="commun/abysse-fond.js?v=3"></script>

<header class="bar">
  <div class="page">
    <a class="brand" href="accueil.html" data-transition="Retour à l'accueil" aria-label="Saitora, accueil"><svg class="mark" viewBox="246 330 740 590" aria-hidden="true"><path d="M262 901L624 341L695 456L407 901Z M725 504L970 901L828 901L653 613Z" fill="currentColor"/><circle cx="620" cy="818" r="55" fill="var(--accent)"/></svg><img src="images/marque/saitora-noir.png" alt="Saitora" width="1165" height="162"></a>
    <div class="right">
      <a class="back" href="accueil.html" data-transition="Retour à l'accueil">Accueil</a>
      <a class="back" href="tarifs.html" data-transition="Les tarifs">Tarifs</a>
      
    </div>
  </div>
</header>

<main class="liste page">
  <h1>Toutes les démos</h1>
  <p class="lead">Treize commerces imaginés, treize sites qui leur ressemblent : chacun a son style et une idée tirée de son métier. Le vôtre sera fait avec votre logo, vos couleurs et vos photos.</p>
  <div class="filtres" id="filtres" role="group" aria-label="Filtrer par famille de métiers"></div>
  <div class="works" id="works"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]);
  // les trois de l'accueil d'abord, puis les autres dans l'ordre de la liste
  const liste = [...UNES.map(u => DEMOS.find(d => d[4] === u)), ...DEMOS.filter(d => !UNES.includes(d[4]))];
  $("works").innerHTML = liste.map(([nom, metier, fam, txt, slug]) => `
    <a class="work" data-fam="${fam}" href="demo-${slug}.html" target="_blank" rel="noopener">
      <div class="top"><div><h2>${esc(nom)}</h2><span class="metier">${esc(metier)}</span></div>${UNES.includes(slug) ? '<span class="une">À la une</span>' : ""}</div>
      <p>${esc(txt)}</p>
      <div class="shot"><img src="media/apercus/${slug}.webp" alt="La page d'accueil de la démo ${esc(nom)}" width="720" height="450" loading="lazy" decoding="async"></div>
    </a>`).join("");
  const fams = [["tout", "Toutes"], ...Object.entries(FAMILLES).filter(([k]) => DEMOS.some(d => d[2] === k))];
  let f = "tout";
  const rend = () => {
    $("filtres").innerHTML = fams.map(([k, n]) => `<button type="button" data-f="${k}" aria-pressed="${k === f}">${n}</button>`).join("");
    document.querySelectorAll(".work").forEach(w => { w.hidden = f !== "tout" && w.dataset.fam !== f; });
  };
  $("filtres").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { f = b.dataset.f; rend(); } });
  rend();
})();
</script>
</body>
</html>
