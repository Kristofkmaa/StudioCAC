<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>(()=>{const d=document.documentElement;let t;try{t=localStorage.getItem("saitora-theme")}catch(e){}d.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})()</script>
<style>html,body{background:#FAFAF9}html[data-theme=dark],html[data-theme=dark] body{background:#0C0C0D}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Saitora, sites vitrines pour commerces et artisans</title>
<meta name="description" content="Sites vitrines rapides et sur mesure pour restaurants, artisans et commerces de proximité. Découvrez les démos et demandez un devis gratuit.">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Saitora">
<meta property="og:title" content="Saitora, sites vitrines pour commerces et artisans">
<meta property="og:description" content="Votre vitrine, ouverte jour et nuit. Sites vitrines sur mesure pour restaurants, artisans et commerces de quartier.">
<meta property="og:url" content="https://kristofkmaa.github.io/StudioCAC/">
<meta property="og:image" content="https://kristofkmaa.github.io/StudioCAC/images/partage.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo Saitora et la phrase « Votre vitrine, ouverte jour et nuit », devant des sites de commerces">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kristofkmaa.github.io/StudioCAC/images/partage.jpg?v=2">
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="theme.css?v=2">
<link rel="prefetch" href="accueil.html">
<style>
/* Écran d'entrée Saitora : avant le site, le logo en grand et la phrase d'accroche, comme une porte qu'on pousse.
   Un seul moment animé : le symbole se construit (les deux traits montent, le point tombe), puis le texte arrive. */
:root{--font:"Jost","Futura","Helvetica Neue",Arial,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
h1,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
:where(a,button){touch-action:manipulation;-webkit-user-select:none;user-select:none}

.top{display:flex;justify-content:flex-end}
.door{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-block:24px}
.mark{height:clamp(130px,28vh,280px);width:auto;display:block;overflow:visible}
.mark .l,.mark .r{fill:currentColor}
.mark .dot{fill:var(--accent)}
.word{height:clamp(30px,5.6vw,70px);width:auto;display:block;margin-top:clamp(20px,3.4vh,36px);filter:var(--logo-filter)}
h1{margin-top:clamp(32px,6vh,60px);font-weight:400;font-size:clamp(1.8rem,1.1rem + 2.6vw,3.3rem);line-height:1.1;letter-spacing:-.02em;max-width:20ch;text-wrap:balance}
h1 .d{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--accent);margin-left:.04em}
.enter{margin-top:clamp(32px,5vh,52px);display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:52px;padding:0 34px;border:0;border-radius:4px;
  background:var(--accent);color:var(--on-accent);font:500 18px var(--font);text-decoration:none;cursor:pointer;transition:background-color 160ms ease,transform 160ms var(--ease-out)}
.enter:active{transform:scale(.97)}
.sub{margin-top:18px;font-size:15px;color:var(--muted)}
.sub a{color:inherit;text-underline-offset:4px;text-decoration-color:var(--accent)}
.foot{text-align:center;font-size:14px;color:var(--faint)}
@media (hover:hover) and (pointer:fine){.enter:hover{background:var(--accent-hover)}.sub a:hover{color:var(--ink)}}
@media (pointer:coarse){.sub a{display:inline-block;padding-block:10px;margin-block:-10px}}

/* le seul moment animé : le symbole se construit, puis le reste apparaît */
@media (prefers-reduced-motion:no-preference){
  .mark .l{animation:rise 700ms var(--ease-out) both}
  .mark .r{animation:rise 700ms var(--ease-out) 120ms both}
  .mark .dot{animation:drop 520ms cubic-bezier(.34,1.4,.64,1) 620ms both}
  .word,h1,.enter,.sub{animation:show 600ms var(--ease-out) both}
  .word{animation-delay:760ms}h1{animation-delay:900ms}.enter{animation-delay:1060ms}.sub{animation-delay:1140ms}
  body.leaving .door,body.leaving .top,body.leaving .foot{opacity:0;transform:scale(.985);transition:opacity 220ms ease,transform 220ms ease}
}
/* en fond : nos sites qui défilent sur un mur incliné, sous un voile pour garder le logo lisible */
.wall{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wall .tilt{position:absolute;left:50%;top:50%;width:max(1800px,190vw);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2vw,32px);
  transform:translate(-50%,-50%) perspective(1600px) rotateX(38deg) rotateZ(-14deg)}
.wall .col{display:flex;flex-direction:column;gap:clamp(16px,2vw,32px)}
.wall img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;display:block;box-shadow:0 20px 50px -20px rgba(0,0,0,.35)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,color-mix(in srgb,var(--bg) 95%,transparent) 30%,color-mix(in srgb,var(--bg) 86%,transparent) 65%,color-mix(in srgb,var(--bg) 74%,transparent))}
.top,.door,.foot{position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){
  .wall .col{animation:scroll 70s linear infinite}
  .wall .col:nth-child(even){animation-direction:reverse;animation-duration:85s}
  .wall{animation:show 1200ms ease both}
  body.leaving .wall{opacity:0;transition:opacity 220ms ease}
}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes show{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<script src="theme.js?v=1" defer></script>

<div class="wall" aria-hidden="true"><div class="tilt" id="tilt"></div></div>

<div class="top">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg></button>
</div>

<main class="door">
  <svg class="mark" viewBox="246 330 740 590" aria-hidden="true"><path class="l" d="M262 901L624 341L695 456L407 901Z"/><path class="r" d="M725 504L970 901L828 901L653 613Z"/><circle class="dot" cx="620" cy="818" r="55"/></svg>
  <img class="word" src="images/marque/saitora-noir.png" alt="Saitora" width="1165" height="162">
  <h1>Votre vitrine, ouverte jour et nuit<span class="d" aria-hidden="true"></span></h1>
  <a class="enter" id="enter" href="accueil.html">Entrer</a>
  <p class="sub">ou directement <a href="devis.html">demander un devis</a></p>
</main>

<p class="foot">Sites vitrines pour les restaurants, les artisans et les commerces de quartier</p>

<script>
// le mur de fond : nos six sites, deux fois par colonne pour que le défilement boucle sans couture
const SITES = ["table-du-port","durand-plomberie","coupe-and-co","pain-dore","villa-oliviers","bois-massif"];
document.getElementById("tilt").innerHTML = [0,1,2,3].map(c => {
  const list = [0,1,2,3].map(i => SITES[(c * 2 + i) % SITES.length]);
  const imgs = list.map(n => `<img src="media/apercus/${n}.webp" alt="" width="720" height="450" decoding="async">`).join("");
  return `<div class="col">${imgs}${imgs}</div>`;
}).join("");

// on entre : la porte s'efface, puis la page d'accueil se construit (transition.js, côté accueil)
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll('a[href="accueil.html"], a[href="devis.html"]').forEach(a => a.addEventListener("click", e => {
  if (reduce || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  document.body.classList.add("leaving");
  setTimeout(() => { location.href = a.href; }, 230);
}));
// retour arrière : la page sort du cache, on la remet visible
addEventListener("pageshow", e => { if (e.persisted) document.body.classList.remove("leaving"); });
</script>
</body>
</html>
