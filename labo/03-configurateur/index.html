<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>Votre site en direct, labo Saitora</title>
<link rel="stylesheet" href="../../polices/jost-a2e892.css">
<style>
:root{--bg:#0C0C0D;--panel:#141416;--ink:#EDEBE7;--muted:#9A9893;--line:#2A2A2D;--accent:#B57BB8;--col:clamp(320px,30vw,400px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Jost",sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* --- le panneau de réglages --- */
.reglages{position:fixed;left:0;top:0;bottom:0;width:var(--col);overflow-y:auto;padding:24px clamp(18px,2vw,28px) 32px;background:var(--panel);border-right:1px solid var(--line);overscroll-behavior:contain}
.haut{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.haut a{color:var(--muted);text-decoration:none;padding:8px 0}
h1{margin:22px 0 0;font-weight:400;font-size:clamp(1.9rem,1.4rem + 1.2vw,2.5rem);line-height:1.02;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.intro{margin:10px 0 0;color:var(--muted);font-size:15px}
.etape{margin-top:26px}
.etape>p{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;font-size:14px;color:var(--muted)}
.etape>p b{font-weight:500;color:var(--ink);font-size:15px}
.etape>p i{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}
.champ{width:100%;padding:13px 14px;border-radius:8px;border:1px solid var(--line);background:#0E0E10;font-size:17px}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces button{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:15px;touch-action:manipulation}
.puces button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.styles button{position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:none;cursor:pointer;text-align:left;touch-action:manipulation}
.styles button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.styles small{display:block;padding:7px 9px 8px;font-size:13px;line-height:1.25}
.styles em{position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#1A0E1B;font:normal 500 11px "Jost",sans-serif}
.styles .tp{pointer-events:none}
.plus{margin-top:8px;padding:10px 0;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:4px}
.teintes{display:flex;flex-wrap:wrap;gap:10px}
.teintes button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);touch-action:manipulation}
.teintes button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--panel)}
.teintes .orig{background:conic-gradient(var(--c) 0 50%,var(--c2) 0)}
.fin{margin-top:30px;display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;min-height:50px;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:none;text-decoration:none;cursor:pointer;font-weight:500}
.btn.plein{background:var(--accent);border-color:transparent;color:#1A0E1B}
.note{margin:8px 0 0;font-size:13px;color:var(--muted)}
/* --- la scène --- */
.scene{margin-left:var(--col);min-height:100vh;padding:20px clamp(16px,3vw,40px) 28px;display:flex;flex-direction:column;align-items:center}
.vue{display:flex;gap:4px;padding:4px;border-radius:999px;background:#1B1B1E}
.vue button{padding:8px 16px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:14px;touch-action:manipulation}
.vue button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cadre{margin-top:16px;width:100%;max-width:1060px;height:calc(100vh - 100px);min-height:520px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;transition:max-width .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}
.cadre.tel{max-width:390px;border-radius:34px;border:10px solid #050506}
.barre{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;background:#E9E7E3;color:#55534F;font-size:13px}
.barre i{width:10px;height:10px;border-radius:50%;background:#C9C6C0}
.barre span{flex:1;margin-left:8px;padding:3px 12px;border-radius:6px;background:#F6F5F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cadre.tel .barre i{display:none}
.ecran{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;container-type:inline-size}
/* --- le site maquette : tout vient des couleurs et polices du style --- */
.site{background:var(--f);color:var(--t);font-family:var(--fx),system-ui,sans-serif;font-size:clamp(14px,1.6cqw,17px);line-height:1.55}
.site .ft{font-family:var(--ft),Georgia,serif}
.site .tp{border-radius:0}
.bloc{padding:clamp(28px,6cqw,72px) clamp(18px,5cqw,64px)}
.bloc h2{margin:0;font-family:var(--ft),Georgia,serif;font-weight:400;font-size:clamp(28px,5.4cqw,58px);line-height:1;letter-spacing:-.01em}
.bloc h2 em{color:var(--a)}
.bloc .chapo{margin:12px 0 0;max-width:46ch;opacity:.78}
.liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(18px,4cqw,48px);margin-top:clamp(18px,3cqw,32px)}
.liste div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--t) 16%,transparent)}
.liste b{font-weight:500}.liste small{display:block;opacity:.65;font-size:.88em}
.liste span{flex:none;font-family:var(--ft),Georgia,serif;font-size:1.15em;color:var(--a)}
.photos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:clamp(6px,1cqw,12px);padding:0 clamp(18px,5cqw,64px)}
.photos img{display:block;width:100%;height:clamp(150px,26cqw,320px);object-fit:cover}
.infos{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4cqw,48px);align-items:start}
.etat{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--a) 16%,transparent);font-weight:500}
.etat i{width:8px;height:8px;border-radius:50%;background:var(--a)}
.heures{margin:16px 0 0;padding:0;list-style:none}
.heures li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--t) 12%,transparent)}
.heures li.auj{font-weight:600;color:var(--a)}
.contact p{margin:10px 0 0}
.go{display:inline-block;margin-top:18px;padding:13px 22px;background:var(--a);color:var(--on);font-weight:600;text-decoration:none}
.pied{padding:clamp(28px,6cqw,64px) clamp(18px,5cqw,64px) 22px;background:var(--s);color:var(--on2)}
.pied b{display:block;font-family:var(--ft),Georgia,serif;font-weight:400;font-size:clamp(40px,11cqw,130px);line-height:.9;letter-spacing:-.02em;overflow-wrap:anywhere}
.pied small{display:block;margin-top:14px;opacity:.7}
@container (max-width:560px){.liste,.infos{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.photos img:first-child{grid-column:1/-1}}
/* --- téléphone : la maquette en haut, les réglages dessous --- */
@media (max-width:860px){
  .reglages{position:static;width:auto;border:0;padding-bottom:40px}
  .scene{position:sticky;top:0;z-index:2;margin:0;min-height:0;padding:10px 12px 10px;background:var(--bg);box-shadow:0 10px 24px rgba(0,0,0,.5)}
  .vue{display:none}
  .cadre,.cadre.tel{margin-top:0;max-width:none;height:46vh;min-height:300px;border-radius:18px;border:5px solid #050506}
  .barre{height:30px}
  .page{display:flex;flex-direction:column-reverse}
  .reglages{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){.cadre{transition:none}::view-transition-group(*){animation:none}}
::view-transition-old(maquette),::view-transition-new(maquette){animation-duration:.35s}
.ecran .site{view-transition-name:maquette}
</style>
</head><body>
<div class="page">
<aside class="reglages" aria-label="Réglages de votre site">
  <div class="haut"><a href="../">← Le labo</a><span>03 · Configurateur</span></div>
  <h1>Votre site,<br>en direct<span>.</span></h1>
  <p class="intro">Choisissez, et votre futur site se construit à côté. Rien n'est envoyé : c'est un aperçu.</p>
  <div class="etape"><p><i>1</i><b>Le nom de votre commerce</b></p><input class="champ" id="nom" maxlength="28" autocomplete="organization" placeholder="Votre commerce"></div>
  <div class="etape"><p><i>2</i><b>Votre métier</b></p><div class="puces" id="metiers" role="group" aria-label="Votre métier"></div></div>
  <div class="etape"><p><i>3</i><b>Le style</b></p><div class="styles" id="styles" role="group" aria-label="Le style"></div><button class="plus" type="button" id="tous">Voir les 14 styles</button></div>
  <div class="etape"><p><i>4</i><b>La couleur principale</b></p><div class="teintes" id="teintes" role="group" aria-label="La couleur principale"></div><p class="note" id="noteCouleur"></p></div>
  <div class="fin">
    <a class="btn plein" id="devis" href="../../devis.html">Je veux ce site</a>
    <button class="btn" type="button" id="partager">Copier le lien de cet aperçu</button>
  </div>
</aside>
<main class="scene">
  <div class="vue" role="group" aria-label="Taille de l'aperçu"><button type="button" data-v="pc" aria-pressed="true">Ordinateur</button><button type="button" data-v="tel" aria-pressed="false">Téléphone</button></div>
  <div class="cadre" id="cadre"><div class="barre"><i></i><i></i><i></i><span id="adresse">votre-commerce.fr</span></div><div class="ecran" id="ecran"></div></div>
</main>
</div>
<script src="../../themes.js"></script>
<script>
(() => {
const BASE = "../../";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]);

// Le contenu d'exemple de chaque métier : accroche, photos (de nos démos), la liste, les horaires, l'action, les styles conseillés
const H = (sem, sam, dim) => [sem, sem, sem, sem, sem, sam, dim];   // lundi → dimanche
const METIERS = {
  "Restaurant": { quoi: "Cuisine corse, face au port", photo: "port/terrasse-coucher", photos: ["port/plat-daurade", "port/plat-pastilla", "port/port-barques"], titre: "La <em>carte</em>", chapo: "Le poisson du jour et les plats de toujours, selon la pêche et la saison.", liste: [["Daurade grillée", "fenouil, citron confit", "24 €"], ["Pastilla de la mer", "", "19 €"], ["Veau aux olives", "polenta de châtaigne", "22 €"], ["Fiadone", "au brocciu", "8 €"]], heures: H("12h–14h, 19h–22h30", "12h–14h, 19h–23h", "12h–14h30"), action: "Réserver une table", styles: ["mediterraneen", "art-deco", "magazine"] },
  "Boulangerie": { quoi: "Fournées du matin", photo: "boulangerie/miches", photos: ["boulangerie/croi", "boulangerie/trad", "boulangerie/choux"], titre: "Les <em>pains</em> du jour", chapo: "Pétris la veille, cuits à l'aube. Ce qui reste à midi part au café d'à côté.", liste: [["Tradition", "", "1,30 €"], ["Pain à la châtaigne", "400 g", "4,20 €"], ["Croissant au beurre", "", "1,20 €"], ["Canistrelli", "le sachet", "5,50 €"]], heures: H("6h30–19h30", "6h30–19h30", "7h–13h"), action: "Commander à retirer", styles: ["fait-main", "retro-70", "magazine"] },
  "Épicerie": { quoi: "Produits de l'île", photo: "zia-rosa/epicerie", photos: ["zia-rosa/tomme-coupe", "zia-rosa/jambons", "zia-rosa/marche"], titre: "Au <em>comptoir</em>", chapo: "Fromages, charcuterie et miel des producteurs qu'on connaît par leur prénom.", liste: [["Tomme de brebis", "Niolu, au kilo", "32 €"], ["Lonzu", "au kilo", "45 €"], ["Miel du maquis", "AOP, 250 g", "14 €"], ["Huile d'olive", "Balagne, 50 cl", "22 €"]], heures: H("9h–13h, 15h30–19h30", "9h–19h30", "Fermé"), action: "Préparer un panier", styles: ["retro-70", "magazine", "fait-main"] },
  "Beauté": { quoi: "Institut et spa", photo: "funtana/massage", photos: ["funtana/hammam", "funtana/vasque", "funtana/galets"], titre: "Les <em>soins</em>", chapo: "Une heure pour soi, sans regarder l'heure.", liste: [["Massage à l'huile d'immortelle", "1 h", "70 €"], ["Hammam", "45 min", "35 €"], ["Soin du visage", "1 h", "55 €"], ["Manucure", "40 min", "30 €"]], heures: H("9h30–19h", "9h–18h", "Fermé"), action: "Voir les places libres", styles: ["moderne-doux", "luxe-minimal", "herbier"] },
  "Artisan": { quoi: "Plomberie et chauffage", photo: "plomberie/artisan", photos: ["plomberie/salle-de-bain", "plomberie/chauffe-eau", "plomberie/fuite"], titre: "Nos <em>services</em>", chapo: "Un prix annoncé avant de venir, et un créneau d'arrivée tenu.", liste: [["Dépannage", "7 j / 7", "dès 89 €"], ["Recherche de fuite", "", "120 €"], ["Chauffe-eau", "posé", "dès 890 €"], ["Salle de bain", "clé en main", "sur devis"]], heures: H("8h–18h", "8h–12h", "Urgences"), action: "Demander un devis", styles: ["affiche-brute", "suisse", "carnet"] },
  "Garage": { quoi: "Mécanique toutes marques", photo: "garage/atelier", photos: ["garage/pneus", "garage/freins", "garage/moteur"], titre: "Les <em>prix</em>, affichés", chapo: "Votre voiture est prête quand on vous l'a dit, au prix qu'on vous a dit.", liste: [["Vidange", "huile et filtre", "89 €"], ["Plaquettes de frein", "avant", "120 €"], ["Pneus", "posés, équilibrés", "dès 70 €"], ["Diagnostic", "", "45 €"]], heures: H("8h–12h, 14h–18h", "8h–12h", "Fermé"), action: "Prendre rendez-vous", styles: ["atelier", "sombre-cinema", "affiche-brute"] },
  "Location": { quoi: "Bateaux, kayaks et paddles", photo: "libecciu/golfe", photos: ["libecciu/kayak", "libecciu/paddle", "libecciu/bateau"], titre: "À <em>louer</em>", chapo: "Partez de la plage, on vous montre les criques sur la carte.", liste: [["Kayak", "demi-journée", "30 €"], ["Paddle", "2 h", "25 €"], ["Bateau sans permis", "la journée", "160 €"], ["Jet-ski", "1 h, avec moniteur", "120 €"]], heures: H("9h–19h", "9h–19h", "9h–19h"), action: "Réserver", styles: ["suisse", "mediterraneen", "energie"] },
  "Hébergement": { quoi: "Chambres d'hôtes au village", photo: "villa/oliveraie-hero", photos: ["villa/chambres", "villa/piscine", "villa/terrasse"], titre: "Les <em>chambres</em>", chapo: "Cinq chambres sous les oliviers, à vingt minutes de la mer.", liste: [["Chambre double", "la nuit", "120 €"], ["Suite avec terrasse", "la nuit", "180 €"], ["La maison entière", "la nuit", "450 €"], ["Petit-déjeuner", "par personne", "15 €"]], heures: H("Accueil 8h–20h", "Accueil 8h–20h", "Accueil 8h–20h"), action: "Voir les dates libres", styles: ["luxe-minimal", "mediterraneen", "art-deco"] },
  "Sport": { quoi: "Salle de sport et coaching", photo: "sport/salle", photos: ["sport/boxe", "sport/halteres", "sport/squat"], titre: "Les <em>formules</em>", chapo: "Douze personnes maximum par cours, un coach qui connaît votre prénom.", liste: [["Séance découverte", "", "offerte"], ["Abonnement", "par mois", "39 €"], ["Coaching", "la séance", "45 €"], ["Cours de boxe", "", "15 €"]], heures: H("6h–22h", "8h–20h", "9h–13h"), action: "Essayer gratuitement", styles: ["energie", "affiche-brute", "suisse"] },
  "Fleuriste": { quoi: "Fleurs de saison", photo: "fleuriste/boutique", photos: ["fleuriste/bouquet-bleu", "fleuriste/roses", "fleuriste/panier"], titre: "Les <em>bouquets</em>", chapo: "Composés le matin avec ce qui est beau ce jour-là.", liste: [["Bouquet du jour", "", "35 €"], ["Composition", "", "50 €"], ["Plante en pot", "", "dès 25 €"], ["Mariage", "", "sur devis"]], heures: H("9h–12h30, 14h30–19h", "9h–19h", "9h–12h30"), action: "Commander un bouquet", styles: ["herbier", "moderne-doux", "fait-main"] },
  "Immobilier": { quoi: "Agence immobilière", photo: "immobilier/maison-pierre", photos: ["immobilier/sejour", "immobilier/baie", "immobilier/village"], titre: "Les <em>biens</em>", chapo: "Des visites préparées, des prix expliqués.", liste: [["Estimation", "sous 48 h", "offerte"], ["T3 vue mer", "Ajaccio, 72 m²", "320 000 €"], ["Maison de village", "4 pièces", "245 000 €"], ["Gestion locative", "", "7 %"]], heures: H("9h–12h, 14h–19h", "9h–12h", "Fermé"), action: "Estimer mon bien", styles: ["carnet", "luxe-minimal", "suisse"] }
};
const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const TEINTES = [["Maquis", "#4F6B3A"], ["Mer", "#1C6E8C"], ["Terre cuite", "#C1623F"], ["Or", "#C9A55A"], ["Bordeaux", "#7A2232"], ["Citron", "#E3B505"]];

// --- couleurs : lisibilité garantie ---
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const lum = h => { const [r, g, b] = rgb(h).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4); return .2126 * r + .7152 * g + .0722 * b; };
const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + .05) / (y + .05); };
const hex = c => "#" + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, "0")).join("");
const mele = (a, b, k) => hex(rgb(a).map((v, i) => v + (rgb(b)[i] - v) * k));
function lisible(accent, fond, texte) {      // rapproche la couleur du texte jusqu'à se détacher du fond (3:1)
  let c = accent, k = 0;
  while (contraste(c, fond) < 3 && k < 1) { k += .1; c = mele(accent, texte, k); }
  return c;
}
const surCouleur = c => contraste(c, "#FFFFFF") >= contraste(c, "#141414") ? "#FFFFFF" : "#141414";

// --- l'état, gardé dans l'adresse pour partager l'aperçu ---
const q = new URLSearchParams(location.search);
const etat = { nom: q.get("nom") || "", metier: METIERS[q.get("metier")] ? q.get("metier") : "Restaurant", style: q.get("style") || "", teinte: q.get("teinte") || "", vue: "pc", tous: false };
let THEMES = [];
$("nom").value = etat.nom;

function themeActuel() {
  const t = THEMES.find(x => x.id === etat.style) || THEMES.find(x => x.id === METIERS[etat.metier].styles[0]) || THEMES[0];
  etat.style = t.id;
  const c = { ...t.couleurs };
  if (etat.teinte) c.accent = lisible(etat.teinte, c.fond, c.texte);
  const m = METIERS[etat.metier];
  return { ...t, couleurs: c, photo: `images/${m.photo}.webp` };
}

function maquette() {
  const t = themeActuel(), m = METIERS[etat.metier], c = t.couleurs, nom = etat.nom.trim() || "Votre commerce";
  const auj = (new Date().getDay() + 6) % 7, ouvert = !/ferm/i.test(m.heures[auj]);
  const lien = nom.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "votre-commerce";
  $("adresse").textContent = lien + ".fr";
  return `<div class="site" style="--f:${c.fond};--t:${c.texte};--a:${c.accent};--s:${c.second};--on:${surCouleur(c.accent)};--on2:${surCouleur(c.second)};--ft:'${t.polices.titres}';--fx:'${t.polices.texte}'">
    ${Themes.render(t, { nom, quoi: m.quoi }, BASE)}
    <section class="bloc"><h2>${m.titre}</h2><p class="chapo">${esc(m.chapo)}</p>
      <div class="liste">${m.liste.map(([n, d, p]) => `<div><p><b>${esc(n)}</b>${d ? `<small>${esc(d)}</small>` : ""}</p><span>${esc(p)}</span></div>`).join("")}</div></section>
    <div class="photos">${m.photos.map(p => `<img src="${BASE}images/${p}.webp" alt="" loading="lazy">`).join("")}</div>
    <section class="bloc infos">
      <div><h2>Les <em>horaires</em></h2><span class="etat"><i></i>${ouvert ? "Ouvert aujourd'hui" : "Fermé aujourd'hui"}</span>
        <ul class="heures">${JOURS.map((j, i) => `<li${i === auj ? ' class="auj"' : ""}><span>${j}</span><span>${esc(m.heures[i])}</span></li>`).join("")}</ul></div>
      <div class="contact"><h2>Nous <em>trouver</em></h2><p>Ajaccio, Corse</p><p>04 00 00 00 00</p><a class="go" href="#" onclick="return false">${esc(m.action)}</a></div>
    </section>
    <footer class="pied"><b>${esc(nom)}</b><small>${esc(m.quoi)} · un site Saitora</small></footer>
  </div>`;
}

function reglages() {
  themeActuel();                                          // fixe le style s'il n'est pas encore choisi
  const m = METIERS[etat.metier];
  $("metiers").innerHTML = Object.keys(METIERS).map(k => `<button type="button" data-v="${k}" aria-pressed="${k === etat.metier}">${k}</button>`).join("");
  const conseilles = m.styles.map(id => THEMES.find(t => t.id === id)).filter(Boolean);
  const liste = etat.tous ? [...conseilles, ...THEMES.filter(t => !m.styles.includes(t.id))] : conseilles;
  if (!liste.some(t => t.id === etat.style) && !etat.tous) { const cur = THEMES.find(t => t.id === etat.style); if (cur) liste.push(cur); }
  const nom = etat.nom.trim() || "Votre commerce";
  $("styles").innerHTML = liste.map(t => `<button type="button" data-v="${t.id}" aria-pressed="${t.id === etat.style}">${Themes.render({ ...t, photo: `images/${m.photo}.webp` }, { nom, quoi: m.quoi }, BASE)}${m.styles.includes(t.id) ? "<em>conseillé</em>" : ""}<small>${esc(t.nom)}</small></button>`).join("");
  $("tous").textContent = etat.tous ? "Seulement les styles conseillés" : "Voir les 14 styles";
  const t = THEMES.find(x => x.id === etat.style);
  $("teintes").innerHTML = `<button type="button" class="orig" data-v="" style="--c:${t.couleurs.accent};--c2:${t.couleurs.fond}" aria-pressed="${!etat.teinte}" aria-label="Celle du style"></button>` +
    TEINTES.map(([n, c]) => `<button type="button" data-v="${c}" style="--c:${c}" aria-pressed="${etat.teinte === c}" aria-label="${n}" title="${n}"></button>`).join("");
  const reel = themeActuel().couleurs.accent;
  $("noteCouleur").textContent = etat.teinte ? (reel.toLowerCase() !== etat.teinte.toLowerCase() ? "Nuancée pour rester lisible sur le fond de ce style." : TEINTES.find(x => x[1] === etat.teinte)[0]) : "Les couleurs d'origine du style.";
  $("devis").href = `${BASE}devis.html?theme=${etat.style}`;
}

const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
function rendre(transition) {
  const go = () => { reglages(); $("ecran").innerHTML = maquette(); };
  if (transition && document.startViewTransition && !calme) document.startViewTransition(go); else go();
  const p = new URLSearchParams();
  if (etat.nom.trim()) p.set("nom", etat.nom.trim());
  p.set("metier", etat.metier); p.set("style", etat.style); if (etat.teinte) p.set("teinte", etat.teinte);
  history.replaceState(null, "", "?" + p);
}

$("nom").addEventListener("input", e => { etat.nom = e.target.value; rendre(false); });
$("metiers").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; etat.metier = b.dataset.v; etat.style = METIERS[etat.metier].styles[0]; rendre(true); });
$("styles").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; etat.style = b.dataset.v; rendre(true); });
$("tous").addEventListener("click", () => { etat.tous = !etat.tous; reglages(); });
$("teintes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; etat.teinte = b.dataset.v; rendre(true); });
document.querySelector(".vue").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".vue button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("cadre").classList.toggle("tel", b.dataset.v === "tel");
});
$("partager").addEventListener("click", () => {
  const ok = () => { $("partager").textContent = "Lien copié"; setTimeout(() => $("partager").textContent = "Copier le lien de cet aperçu", 1800); };
  try { navigator.clipboard.writeText(location.href).then(ok).catch(() => {}); } catch (_) {}
});

Themes.load(BASE).then(list => { THEMES = list; Themes.fonts(list, BASE); rendre(false); })
  .catch(() => { $("ecran").innerHTML = '<p style="padding:24px;color:#555">Les styles n\'ont pas pu être chargés.</p>'; });
})();
</script>
</body></html>
